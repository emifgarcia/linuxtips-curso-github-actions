name: Compartilhando arquivo entre jobs

on:
  push:
    branches:
      - main

jobs:
  giropops_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versao do ubuntu
        run: cat /etc/os-release

      - name: Diretório de trabalho
        run: pwd

      - name: Criar arquivo
        run: echo "Meu primeiro arquivo" > arquivo.txt

      - name: Listar arquivos
        run: ls -l

      - uses: actions/upload-artifact@v7  
        with:
          name: strigus
          path: arquivo.txt
  
  giropops_2:
    runs-on: ubuntu-latest
    needs: giropops_1
    steps:
      - name: Diretório de trabalho
        run: pwd

      - name: Listar arquivos
        run: ls -l
      
      - uses: actions/download-artifact@v8
        with:
          name: strigus
          path: arquivo.txt

      - name: Listar arquivos diretorio strigus
        run: ls -l strigus/

      - name: Mover arquivo
        run: mv strigus/arquivo.txt . && rm -rf strigus

      - name: Ler arquivo
        run: cat arquivo.txt