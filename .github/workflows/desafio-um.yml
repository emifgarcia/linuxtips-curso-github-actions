name: desafio-um

on:
  workflow_dispatch:
    inputs:
      imagem:
        description: 'Informe a imagem Docker com a tag. Ex: nginx:latest'
        required: true
        type: string

jobs:
  download-image-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Download Image Docker
        run: docker pull ${{ inputs.imagem }}
    
      - name: Image List
        run: docker images

      - name: Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ inputs.imagem }}